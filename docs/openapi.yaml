openapi: 3.1.0
info:
  version: 1.0.0
  title: My Contacts
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: A web application for chatting and exchanging contacts.
tags:
  - name: Contacts
    description: Operations about contact.
servers:
  - url: https://nodejs-hw-mongodb-7-5q1k.onrender.com
paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'

  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/contactId/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/contactId/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/contactId/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Contact`s phone number'
    type: string
    example: '+380504561235'
  email:
    description: 'Contact`s email'
    type: string
    example: 'user.email@mail.com'
  isFavourite:
    description: 'Whether the contact is marked as favourite'
    type: boolean
    example: true
  contactType:
    description: 'Contact`s type'
    type: string
    enum: ['work', 'home', 'personal']
    example: 'personal'
  userId:
    description: 'The contact belongs to the user with the ID'
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
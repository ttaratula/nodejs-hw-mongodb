tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create a contact with payload
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phone
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phone:
            description: 'Contact`s phone number'
            type: string
            example: '+380504561235'
          email:
            description: 'Contact`s email'
            type: string
            example: 'user.email@mail.com'
          isFavourite:
            description: 'Whether the contact is marked as favourite'
            type: boolean
            example: true
          contactType:
            description: 'Contact`s type'
            type: string
            enum: ['work', 'home', 'personal']
            example: 'personal'
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/contact.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'

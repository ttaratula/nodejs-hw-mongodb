tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update contact's information by id
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 20
            description: Username of the contact
          phone:
            type: string
            minLength: 3
            maxLength: 20
            description: Phone number of the contact
          email:
            type: string
            format: email
            description: Email of the contact
          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
          contactType:
            type: string
            enum: ['work', 'home', 'personal']
            description: Type of the contact
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
        additionalProperties: false
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully updated contact with id 65ca67e7ae7f10c88b598384!
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'

